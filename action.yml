name: 'Porter tool installer'
description: 'Install the porter binary.'

inputs:
  tagged_release:
    description: 'Specific Porter version to install (e.g. v0.68.13). Takes precedence over channel.'
    required: false
  channel:
    description: >-
      Release channel to install when tagged_release is not set. "stable"
      (default) installs the latest promoted release; "edge" installs the most
      recently published release, whether or not it has been promoted to
      latest.
    required: false
    default: 'stable'

branding:
  color: 'blue'
  icon: 'arrow-down-circle'
runs:
  using: 'composite'
  steps:
    - name: Setup Porter
      shell: bash
      env:
        TAGGED_RELEASE: ${{ inputs.tagged_release }}
        CHANNEL: ${{ inputs.channel }}
        GH_TOKEN: ${{ github.token }}
      run: |
        case "$CHANNEL" in
          stable|edge) ;;
          *) echo "Unknown channel: $CHANNEL (expected stable or edge)" >&2; exit 1 ;;
        esac

        VERSION="$TAGGED_RELEASE"
        if [ -z "$VERSION" ] && [ "$CHANNEL" = "edge" ]; then
          VERSION=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/porter-dev/releases/releases?per_page=1" \
            | sed -n 's/.*"tag_name": "\(v[^"]*\)".*/\1/p' | head -1)
          if [ -z "$VERSION" ]; then
            echo "Failed to resolve the newest release from GitHub" >&2
            exit 1
          fi
          echo "Resolved edge release: $VERSION"
        fi

        INSTALL_URL="https://install.porter.run"
        if [ -n "$VERSION" ]; then
          INSTALL_URL="${INSTALL_URL}?version=${VERSION}"
        fi
        /bin/bash -c "$(curl -fsSL $INSTALL_URL)"
        porter version
