name: 'Porter tool installer'
description: 'Install the porter binary.'

inputs:
  tagged_release:
    description: 'Specific Porter version to install (e.g. v0.68.13). Takes precedence over allow_unstable.'
    required: false
  allow_unstable:
    description: >-
      When true, install the most recently published release, whether or not
      it has been promoted to latest. Falls back to the latest promoted
      release if the newest release cannot be resolved. Defaults to false,
      which installs the latest promoted release.
    required: false
    default: 'false'

branding:
  color: 'blue'
  icon: 'arrow-down-circle'
runs:
  using: 'composite'
  steps:
    - name: Setup Porter
      shell: bash
      env:
        TAGGED_RELEASE: ${{ inputs.tagged_release }}
        ALLOW_UNSTABLE: ${{ inputs.allow_unstable }}
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION="$TAGGED_RELEASE"
        if [ -z "$VERSION" ] && [ "$ALLOW_UNSTABLE" = "true" ]; then
          VERSION=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/porter-dev/releases/releases?per_page=1" \
            | sed -n 's/.*"tag_name": "\(v[0-9][0-9A-Za-z.+-]*\)".*/\1/p' | head -1) || true
          if [ -n "$VERSION" ]; then
            echo "Resolved newest release: $VERSION"
          else
            echo "[WARNING] Could not resolve the newest release from GitHub; falling back to the latest promoted release"
          fi
        fi

        INSTALL_URL="https://install.porter.run"
        if [ -n "$VERSION" ]; then
          INSTALL_URL="${INSTALL_URL}?version=${VERSION}"
        fi
        /bin/bash -c "$(curl -fsSL "$INSTALL_URL")"
        porter version
